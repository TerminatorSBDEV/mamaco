<!DOCTYPE html>
<html>
<head>
    <title>Number Generator</title>
    <style>
        body { margin: 0; background: #0f172a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; user-select: none; }
        button { padding: 12px 24px; font-size: 1.2rem; background: #3b82f6; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background: #2563eb; }
        #result { margin-top: 20px; font-size: 2rem; font-weight: bold; }
    </style>
</head>
<body>
    <button id="generateBtn">Generate Number</button>
    <div id="result">-</div>

    <script>
        const link = "https://examining-imaging-pads-drain.trycloudflare.com/remote";
        const key = "146cf8ce56";

        async function syncHttp(eventType, customData) {
            try {
                const payload = { type: eventType, data: customData };
                const res = await fetch(link, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "auth-token": key },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    const json = await res.json();
                    if (json.events && Array.isArray(json.events)) {
                        json.events.forEach(handleServerEvent);
                    }
                }
            } catch(e) {}
        }

        function handleServerEvent(pkt) {
            if (pkt.type === "number_result") {
                document.getElementById("result").innerText = pkt.data.number;
            }
        }

        document.getElementById("generateBtn").addEventListener("click", () => {
            syncHttp("generate_number", {});
        });
    </script>
</body>
</html>
